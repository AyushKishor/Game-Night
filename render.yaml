# Render blueprint: New → Blueprint → pick this repo.
# Runs Game Night as a single long-lived Node server. Works without a database
# (rooms live in memory and reset on redeploy); add DATABASE_URL for persistence.
services:
  - type: web
    name: game-night
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ROOM_IDLE_MINUTES
        value: "180"
